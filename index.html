<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Memorama de Tom 🐱</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --sky: #87CEEB;
    --cloud: #fff;
    --tom-blue: #4A90D9;
    --tom-light: #7BB8F0;
    --accent-yellow: #FFD700;
    --accent-pink: #FF6B9D;
    --accent-green: #5CC85A;
    --accent-orange: #FF8C42;
    --card-back: #4A90D9;
    --card-front: #fff;
    --shadow: rgba(0,0,0,0.18);
    --bg: linear-gradient(160deg, #b3e0ff 0%, #e0f4ff 40%, #ffecd2 100%);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Nunito', sans-serif;
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 12px 8px 24px;
    overflow-x: hidden;
  }

  /* Floating bubbles background */
  .bubbles {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 0; overflow: hidden;
  }
  .bubble {
    position: absolute; border-radius: 50%;
    background: rgba(255,255,255,0.35);
    animation: floatUp linear infinite;
  }
  @keyframes floatUp {
    0% { transform: translateY(110vh) scale(0.8); opacity: 0.7; }
    100% { transform: translateY(-10vh) scale(1.1); opacity: 0; }
  }

  header {
    position: relative; z-index: 2;
    text-align: center; margin-bottom: 10px;
  }
  .title {
    font-family: 'Fredoka One', cursive;
    font-size: clamp(1.8rem, 7vw, 2.6rem);
    color: #fff;
    text-shadow: 0 3px 0 #2563a8, 0 5px 12px rgba(0,0,0,0.18);
    letter-spacing: 1px;
  }
  .subtitle {
    font-size: clamp(0.8rem, 3.5vw, 1rem);
    color: #2563a8;
    font-weight: 700;
    background: rgba(255,255,255,0.7);
    border-radius: 20px;
    padding: 3px 14px;
    display: inline-block;
    margin-top: 4px;
  }

  /* Score bar */
  .scorebar {
    position: relative; z-index: 2;
    display: flex; gap: 10px; align-items: center;
    background: rgba(255,255,255,0.75);
    border-radius: 30px;
    padding: 7px 18px;
    margin-bottom: 12px;
    box-shadow: 0 3px 12px var(--shadow);
    flex-wrap: wrap;
    justify-content: center;
  }
  .score-item {
    font-weight: 900; font-size: 0.95rem;
    color: #2563a8;
    display: flex; align-items: center; gap: 4px;
  }
  .score-val {
    font-family: 'Fredoka One', cursive;
    font-size: 1.2rem;
    color: var(--accent-orange);
  }

  /* Instructions hint */
  .hint {
    position: relative; z-index: 2;
    font-size: 0.82rem;
    color: #555;
    background: rgba(255,255,255,0.6);
    border-radius: 16px;
    padding: 4px 14px;
    margin-bottom: 14px;
    text-align: center;
  }

  /* Mode selector */
  .mode-selector {
    position: relative; z-index: 2;
    display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap;
    justify-content: center;
  }
  .mode-btn {
    font-family: 'Fredoka One', cursive;
    font-size: 0.85rem;
    border: 3px solid transparent;
    border-radius: 20px;
    padding: 6px 14px;
    cursor: pointer;
    background: rgba(255,255,255,0.7);
    color: #2563a8;
    transition: all 0.2s;
    box-shadow: 0 2px 8px var(--shadow);
  }
  .mode-btn.active, .mode-btn:hover {
    background: var(--tom-blue);
    color: #fff;
    border-color: var(--accent-yellow);
    transform: scale(1.05);
  }

  /* Grid */
  .grid {
    position: relative; z-index: 2;
    display: grid;
    gap: clamp(8px, 2vw, 14px);
    justify-content: center;
    width: 100%;
    max-width: 640px;
  }
  .grid.cols-4 { grid-template-columns: repeat(4, 1fr); }
  .grid.cols-3 { grid-template-columns: repeat(3, 1fr); }

  /* Card */
  .card {
    aspect-ratio: 3/4;
    perspective: 800px;
    cursor: pointer;
    border-radius: 18px;
    min-width: 60px;
    max-width: 130px;
    width: 100%;
    justify-self: center;
  }
  .card-inner {
    width: 100%; height: 100%;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.45s cubic-bezier(.4,2,.55,.9);
    border-radius: 18px;
  }
  .card.flipped .card-inner { transform: rotateY(180deg); }
  .card.matched .card-inner { transform: rotateY(180deg); }
  .card.matched .card-front {
    background: linear-gradient(135deg, #d4ffd4, #a0f0a0);
    box-shadow: 0 0 0 3px var(--accent-green), 0 6px 20px rgba(0,200,0,0.25);
  }
  .card.shake { animation: shake 0.4s ease; }
  @keyframes shake {
    0%,100%{transform:rotateY(180deg)}
    20%{transform:rotateY(180deg) translateX(-6px)}
    40%{transform:rotateY(180deg) translateX(6px)}
    60%{transform:rotateY(180deg) translateX(-4px)}
    80%{transform:rotateY(180deg) translateX(4px)}
  }

  .card-face {
    position: absolute; inset: 0;
    backface-visibility: hidden;
    border-radius: 16px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    box-shadow: 0 4px 14px var(--shadow);
    padding: 6px;
    user-select: none;
  }
  .card-back {
    background: linear-gradient(135deg, #4A90D9, #2563a8);
    border: 3px solid rgba(255,255,255,0.4);
  }
  .card-back-emoji {
    font-size: clamp(1.6rem, 6vw, 2.4rem);
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
  }
  .card-back-dots {
    display: grid; grid-template-columns: repeat(3, 8px);
    gap: 5px; margin-top: 8px;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.35); }

  .card-front {
    background: #fff;
    border: 3px solid rgba(74,144,217,0.3);
    flex-direction: column;
    transform: rotateY(180deg);
    gap: 4px;
  }
  .card-emoji {
    font-size: clamp(1.8rem, 7vw, 2.8rem);
    line-height: 1;
    filter: drop-shadow(0 2px 3px rgba(0,0,0,0.1));
  }
  .card-label {
    font-family: 'Fredoka One', cursive;
    font-size: clamp(0.55rem, 2.2vw, 0.78rem);
    color: #2563a8;
    text-align: center;
    line-height: 1.1;
  }
  .pair-badge {
    position: absolute; top: 5px; right: 7px;
    width: 18px; height: 18px;
    border-radius: 50%;
    font-size: 0.55rem;
    font-weight: 900;
    display: flex; align-items: center; justify-content: center;
    color: #fff;
  }

  /* Win screen */
  .win-screen {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.55);
    z-index: 100;
    align-items: center; justify-content: center;
    flex-direction: column;
  }
  .win-screen.show { display: flex; }
  .win-box {
    background: linear-gradient(135deg, #fff 60%, #e0f4ff);
    border-radius: 28px;
    padding: 32px 28px;
    text-align: center;
    box-shadow: 0 8px 40px rgba(0,0,0,0.25);
    max-width: 320px;
    animation: popIn 0.5s cubic-bezier(.4,2,.55,.9);
  }
  @keyframes popIn {
    0%{transform:scale(0.5);opacity:0}
    100%{transform:scale(1);opacity:1}
  }
  .win-emoji { font-size: 3.5rem; display: block; margin-bottom: 8px; }
  .win-title {
    font-family: 'Fredoka One', cursive;
    font-size: 1.9rem;
    color: var(--tom-blue);
    text-shadow: 0 2px 0 #b3d8f5;
    margin-bottom: 6px;
  }
  .win-msg { font-size: 0.95rem; color: #555; margin-bottom: 18px; line-height: 1.4; }
  .win-stats { font-weight: 900; color: var(--accent-orange); font-size: 1.1rem; margin-bottom: 18px; }
  .btn-play {
    font-family: 'Fredoka One', cursive;
    font-size: 1.1rem;
    background: linear-gradient(135deg, var(--tom-blue), #2563a8);
    color: #fff;
    border: none;
    border-radius: 24px;
    padding: 12px 32px;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(74,144,217,0.4);
    transition: transform 0.15s;
  }
  .btn-play:active { transform: scale(0.96); }

  /* Confetti */
  .confetti-piece {
    position: fixed;
    width: 10px; height: 10px;
    border-radius: 2px;
    animation: confettiFall 2.5s ease-in forwards;
    z-index: 200;
    pointer-events: none;
  }
  @keyframes confettiFall {
    0%{transform:translateY(-20px) rotate(0deg);opacity:1}
    100%{transform:translateY(100vh) rotate(720deg);opacity:0}
  }

  .reset-btn {
    position: relative; z-index: 2;
    margin-top: 14px;
    font-family: 'Fredoka One', cursive;
    font-size: 0.95rem;
    background: rgba(255,255,255,0.75);
    color: #2563a8;
    border: 2px solid var(--tom-blue);
    border-radius: 20px;
    padding: 8px 22px;
    cursor: pointer;
    transition: all 0.2s;
    box-shadow: 0 2px 8px var(--shadow);
  }
  .reset-btn:hover { background: var(--tom-blue); color: #fff; }
</style>
</head>
<body>

<div class="bubbles" id="bubbles"></div>

<header>
  <div class="title">🐱 Memorama de Tom</div>
  <div class="subtitle">My Talking Tom & Friends</div>
</header>

<div class="scorebar">
  <div class="score-item">⭐ Parejas: <span class="score-val" id="matches">0</span></div>
  <div class="score-item">🎯 Intentos: <span class="score-val" id="attempts">0</span></div>
  <div class="score-item">🏆 Récord: <span class="score-val" id="record">--</span></div>
</div>

<div class="hint" id="hint">💡 Encuentra las parejas que van juntas ¡no son iguales!</div>

<div class="mode-selector">
  <button class="mode-btn active" onclick="setMode('contrarios')">↔️ Contrarios</button>
  <button class="mode-btn" onclick="setMode('secuencias')">🔄 Secuencias</button>
  <button class="mode-btn" onclick="setMode('emociones')">😊 Emociones</button>
</div>

<div class="grid cols-4" id="grid"></div>

<button class="reset-btn" onclick="resetGame()">🔄 Nuevo juego</button>

<div class="win-screen" id="winScreen">
  <div class="win-box">
    <span class="win-emoji">🎉</span>
    <div class="win-title">¡Ganaste!</div>
    <div class="win-msg" id="winMsg">¡Muy bien! Encontraste todas las parejas</div>
    <div class="win-stats" id="winStats"></div>
    <button class="btn-play" onclick="resetGame()">¡Jugar otra vez! 🐱</button>
  </div>
</div>

<script>
const MODES = {
  contrarios: {
    hint: "↔️ Encuentra los CONTRARIOS de Tom y sus amigos",
    pairs: [
      { a: {e:"😸",l:"Tom feliz"}, b: {e:"😿",l:"Tom triste"}, color:"#FF6B9D" },
      { a: {e:"🌞",l:"Día"}, b: {e:"🌙",l:"Noche"}, color:"#FFD700" },
      { a: {e:"🐱",l:"Tom grande"}, b: {e:"🐱",l:"Tom chico",small:true}, color:"#4A90D9" },
      { a: {e:"🍽️",l:"Plato lleno"}, b: {e:"🫙",l:"Plato vacío"}, color:"#FF8C42" },
      { a: {e:"😴",l:"Tom dormido"}, b: {e:"👀",l:"Tom despierto"}, color:"#9B59B6" },
      { a: {e:"🧼",l:"Tom limpio"}, b: {e:"💩",l:"Tom sucio"}, color:"#5CC85A" },
      { a: {e:"🔊",l:"Fuerte"}, b: {e:"🤫",l:"Silencio"}, color:"#E74C3C" },
      { a: {e:"🏃",l:"Rápido"}, b: {e:"🐢",l:"Lento"}, color:"#1ABC9C" },
    ]
  },
  secuencias: {
    hint: "🔄 Encuentra qué pasó ANTES y DESPUÉS",
    pairs: [
      { a: {e:"🥚",l:"Huevo"}, b: {e:"🐣",l:"Pollito"}, color:"#FFD700" },
      { a: {e:"😿",l:"Tom triste"}, b: {e:"🎁",l:"¡Un regalo!"}, color:"#FF6B9D" },
      { a: {e:"🌱",l:"Semilla"}, b: {e:"🌳",l:"Árbol"}, color:"#5CC85A" },
      { a: {e:"🍫",l:"Chocolate"}, b: {e:"😋",l:"¡Rico!"}, color:"#8B4513" },
      { a: {e:"😪",l:"Con sueño"}, b: {e:"😴",l:"Dormido"}, color:"#9B59B6" },
      { a: {e:"🚿",l:"Hora del baño"}, b: {e:"✨",l:"¡Limpio!"}, color:"#4A90D9" },
      { a: {e:"🌧️",l:"Lluvia"}, b: {e:"🌈",l:"Arcoíris"}, color:"#E74C3C" },
      { a: {e:"🐛",l:"Oruga"}, b: {e:"🦋",l:"Mariposa"}, color:"#FF8C42" },
    ]
  },
  emociones: {
    hint: "😊 ¿Qué hace sentir así a Tom? ¡Encuentra la causa!",
    pairs: [
      { a: {e:"😸",l:"Tom feliz"}, b: {e:"🎂",l:"Pastel"}, color:"#FFD700" },
      { a: {e:"😿",l:"Tom triste"}, b: {e:"💔",l:"Juguete roto"}, color:"#FF6B9D" },
      { a: {e:"😱",l:"Tom asustado"}, b: {e:"⛈️",l:"Tormenta"}, color:"#9B59B6" },
      { a: {e:"😡",l:"Tom enojado"}, b: {e:"🚫",l:"Le dijeron no"}, color:"#E74C3C" },
      { a: {e:"🥰",l:"Tom enamorado"}, b: {e:"🐱",l:"Angela"}, color:"#FF6B9D" },
      { a: {e:"😂",l:"Tom riendo"}, b: {e:"🎭",l:"Chiste"}, color:"#FFD700" },
      { a: {e:"😰",l:"Tom nervioso"}, b: {e:"💉",l:"Doctor"}, color:"#4A90D9" },
      { a: {e:"🤩",l:"Tom sorprendido"}, b: {e:"🎠",l:"¡Parque!"}, color:"#5CC85A" },
    ]
  }
};

let currentMode = 'contrarios';
let cards = [];
let flipped = [];
let matched = 0;
let attempts = 0;
let locked = false;
let record = {};

function setMode(mode) {
  currentMode = mode;
  document.querySelectorAll('.mode-btn').forEach((b,i) => {
    b.classList.toggle('active', ['contrarios','secuencias','emociones'][i] === mode);
  });
  resetGame();
}

function buildDeck() {
  const data = MODES[currentMode];
  document.getElementById('hint').textContent = data.hint;
  let deck = [];
  data.pairs.forEach((pair, idx) => {
    deck.push({ ...pair.a, pairId: idx, side: 'a', color: pair.color, id: `${idx}-a` });
    deck.push({ ...pair.b, pairId: idx, side: 'b', color: pair.color, id: `${idx}-b` });
  });
  // shuffle
  for (let i = deck.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [deck[i], deck[j]] = [deck[j], deck[i]];
  }
  return deck;
}

function renderGrid() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  grid.className = 'grid cols-4';
  cards.forEach((card, idx) => {
    const el = document.createElement('div');
    el.className = 'card';
    el.dataset.idx = idx;
    el.innerHTML = `
      <div class="card-inner">
        <div class="card-face card-back">
          <div class="card-back-emoji">🐱</div>
          <div class="card-back-dots">
            ${Array(9).fill('<div class="dot"></div>').join('')}
          </div>
        </div>
        <div class="card-face card-front">
          <div class="pair-badge" style="background:${card.color}">${card.pairId+1}</div>
          <div class="card-emoji" style="${card.small?'font-size:1.2rem':''}">${card.e}</div>
          <div class="card-label">${card.l}</div>
        </div>
      </div>`;
    el.addEventListener('click', () => flipCard(idx, el));
    grid.appendChild(el);
  });
}

function flipCard(idx, el) {
  if (locked || el.classList.contains('flipped') || el.classList.contains('matched')) return;
  el.classList.add('flipped');
  flipped.push({ idx, el });
  if (flipped.length === 2) {
    attempts++;
    document.getElementById('attempts').textContent = attempts;
    locked = true;
    setTimeout(checkMatch, 900);
  }
}

function checkMatch() {
  const [a, b] = flipped;
  const ca = cards[a.idx], cb = cards[b.idx];
  if (ca.pairId === cb.pairId && ca.side !== cb.side) {
    a.el.classList.add('matched');
    b.el.classList.add('matched');
    matched++;
    document.getElementById('matches').textContent = matched;
    if (matched === 8) setTimeout(showWin, 400);
  } else {
    a.el.classList.remove('flipped');
    b.el.classList.remove('flipped');
    a.el.classList.add('shake');
    b.el.classList.add('shake');
    setTimeout(() => {
      a.el.classList.remove('shake');
      b.el.classList.remove('shake');
    }, 400);
  }
  flipped = [];
  locked = false;
}

function showWin() {
  const msgs = {
    contrarios: "¡Encontraste todos los contrarios! 🌟",
    secuencias: "¡Sabes qué pasa antes y después! 🌈",
    emociones: "¡Entiendes muy bien los sentimientos! 💖"
  };
  const key = currentMode + '-' + attempts;
  if (!record[currentMode] || attempts < record[currentMode]) {
    record[currentMode] = attempts;
  }
  document.getElementById('record').textContent = record[currentMode] || '--';
  document.getElementById('winMsg').textContent = msgs[currentMode];
  document.getElementById('winStats').textContent = `🎯 Lo lograste en ${attempts} intentos`;
  document.getElementById('winScreen').classList.add('show');
  launchConfetti();
}

function resetGame() {
  document.getElementById('winScreen').classList.remove('show');
  matched = 0; attempts = 0; flipped = []; locked = false;
  document.getElementById('matches').textContent = 0;
  document.getElementById('attempts').textContent = 0;
  if (record[currentMode]) document.getElementById('record').textContent = record[currentMode];
  cards = buildDeck();
  renderGrid();
}

function launchConfetti() {
  const colors = ['#FF6B9D','#FFD700','#4A90D9','#5CC85A','#FF8C42','#9B59B6'];
  for (let i = 0; i < 60; i++) {
    const c = document.createElement('div');
    c.className = 'confetti-piece';
    c.style.cssText = `
      left:${Math.random()*100}vw;
      top:-10px;
      background:${colors[Math.floor(Math.random()*colors.length)]};
      animation-delay:${Math.random()*1.5}s;
      animation-duration:${1.5+Math.random()*2}s;
      transform:rotate(${Math.random()*360}deg);
      width:${6+Math.random()*10}px;
      height:${6+Math.random()*10}px;
    `;
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 4000);
  }
}

// Bubbles background
function makeBubbles() {
  const container = document.getElementById('bubbles');
  for (let i = 0; i < 12; i++) {
    const b = document.createElement('div');
    b.className = 'bubble';
    const size = 20 + Math.random() * 60;
    b.style.cssText = `
      width:${size}px; height:${size}px;
      left:${Math.random()*100}%;
      animation-duration:${8+Math.random()*12}s;
      animation-delay:${Math.random()*10}s;
    `;
    container.appendChild(b);
  }
}

makeBubbles();
resetGame();
</script>
</body>
</html>
